name: VT Markets Hub Bot 24/7 Cloud Runner

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  cancel-previous-on-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel any older running or queued bot cycles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pass in 1 2; do
            for id in $(gh run list --workflow vt_bot_247.yml --limit 20 --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId'); do
              if [ "$id" != "${{ github.run_id }}" ]; then
                echo "Cancelling old run $id (pass $pass)"
                gh run cancel "$id" || true
              fi
            done
            sleep 12
          done

  run-bot-247:
    needs: [cancel-previous-on-push]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 345
    concurrency:
      group: vt-markets-hub-bot-247
      cancel-in-progress: false
    env:
      TZ: Asia/Ho_Chi_Minh
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
      VT_BOT_TOKEN: ${{ secrets.VT_BOT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Timezone (Asia/Ho_Chi_Minh UTC+7)
        run: |
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh
          date

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull latest state before starting
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git pull --rebase --autostash origin main || true

      - name: Run VT Markets Hub Bot (5h25m cycle)
        run: |
          python bot_truc_nhom.py --max-runtime-seconds 19500

      - name: Save & Commit Bot State back to Repository
        if: ${{ !cancelled() }}
        run: |
          git config user.name "VT-Markets-Bot-Cloud"
          git config user.email "bot@vtmarketshub.local"
          git add bot_state.json content_balance_state.json whitelist.json daily_buzz_pool.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync bot state [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main || true
              git push origin main && break
              sleep $((i * 3))
            done
          fi

      - name: Self-trigger next 24/7 cycle immediately
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run vt_bot_247.yml || true
