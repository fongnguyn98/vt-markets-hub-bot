name: Content Pipeline

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-pipeline
  cancel-in-progress: false

jobs:
  refill-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Ho_Chi_Minh
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
      VT_BOT_TOKEN: ${{ secrets.VT_BOT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Test content rules
        run: python -m unittest discover -s tests

      - name: Refill queue
        run: python content_pipeline.py

      - name: Commit new items
        run: |
          git config user.name "VT-Markets-Bot-Cloud"
          git config user.email "bot@vtmarketshub.local"
          git add content_queue || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: add queued content [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main || true
              git push origin main && break
              sleep $((i * 3))
            done
          fi
